# --------------------------------------------------
# Application Name
# --------------------------------------------------
spring.application.name=Backend-servicehub

# --------------------------------------------------
# Server Configuration
# --------------------------------------------------
server.port=${SERVER_PORT:8080}   # Uses Render's PORT if available
server.address=0.0.0.0            # Listen on all interfaces in container

# --------------------------------------------------
# Database Configuration
# --------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --------------------------------------------------
# File Upload Configuration
# --------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --------------------------------------------------
# Mail Configuration
# --------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# --------------------------------------------------
# JWT / Security (if used)
# --------------------------------------------------
jwt.secret=${JWT_SECRET:defaultSecret}
jwt.expiration=${JWT_EXPIRATION:3600000} # default 1 hour in ms

# --------------------------------------------------
# Frontend URL (if used for CORS or emails)
# --------------------------------------------------
frontend.url=${FRONTEND_URL:http://localhost:5173}

# --------------------------------------------------
# Cloudinary (if used)
# --------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}